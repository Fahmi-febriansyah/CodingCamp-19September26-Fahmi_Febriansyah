<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="nav-content">
      <div class="nav-left"></div>
      <h1 class="logo">Expense & Budget Visualizer</h1>
      <button id="themeBtn" class="theme-toggle" type="button">Dark Mode</button>
    </div>
  </header>

  <main class="main-container">

    <section class="card balance-card">
      <span class="balance-label">TOTAL BALANCE</span>
      <div id="totalBalance" class="balance-number">$0.00</div>
    </section>

    <div id="limitBanner" class="alert-box" style="display: none;">
      Total pengeluaran melebihi batas anggaran!
    </div>

    <section class="card">
      <h2>Add Transaction</h2>
      <form id="transactionForm">
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input type="text" id="itemName" placeholder="e.g. Cilok">
          <span class="error-msg" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" step="0.01" placeholder="e.g. 14.94">
          <span class="error-msg" id="amountError"></span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
            <option value="__new__">+ Add New Category</option>
          </select>
          <span class="error-msg" id="categoryError"></span>
        </div>

        <div class="form-group" id="customCatRow" style="display: none;">
          <label for="customCatInput">New Category Name</label>
          <div class="input-inline">
            <input type="text" id="customCatInput" placeholder="e.g. Bills">
            <button type="button" id="saveCatBtn" class="btn-sub">Add</button>
            <button type="button" id="cancelCatBtn" class="btn-cancel">Cancel</button>
          </div>
          <span class="error-msg" id="customCatError"></span>
        </div>

        <button type="submit" class="btn-blue">Add Transaction</button>
      </form>
    </section>

    <section class="card settings-card">
      <div class="controls-grid">
        <div class="control-box">
          <label for="spendingLimit">Spending Limit</label>
          <input type="number" id="spendingLimit" step="0.01" placeholder="Set limit (optional)">
        </div>
        <div class="control-box">
          <label for="sortBy">Sort By</label>
          <select id="sortBy">
            <option value="date-desc">Newest</option>
            <option value="date-asc">Oldest</option>
            <option value="amount-desc">Highest Amount</option>
            <option value="amount-asc">Lowest Amount</option>
            <option value="category-asc">Category (A-Z)</option>
          </select>
        </div>
        <div class="control-box">
          <label for="filterCategory">Filter</label>
          <select id="filterCategory">
            <option value="all">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>
      </div>
    </section>

    <div class="two-column">
      <section class="card">
        <h2>Transactions</h2>
        <div class="tx-list" id="transactionList">
          <p class="empty-text" id="emptyTx">No transactions yet.</p>
        </div>
      </section>

      <section class="card">
        <h2>Spending by Category</h2>
        <div class="chart-wrap">
          <canvas id="categoryChart"></canvas>
          <p class="empty-text" id="emptyChart">No spending data yet.</p>
        </div>
      </section>
    </div>

    <section class="card">
      <div class="summary-head">
        <h2>Monthly Summary</h2>
        <div class="month-pagination">
          <button type="button" id="prevMonth" class="page-btn">&lt;</button>
          <span id="monthTitle">September 2026</span>
          <button type="button" id="nextMonth" class="page-btn">&gt;</button>
        </div>
      </div>
      <div id="monthlyBreakdown" class="breakdown-grid"></div>
    </section>

  </main>

  <footer class="footer">
    <p>Expense & Budget Visualizer &copy; 2026</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
